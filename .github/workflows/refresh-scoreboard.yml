name: Refresh VIP Live scoreboard

on:
  schedule:
    # 12:00 UTC daily (08:00 ET in summer, 07:00 ET in winter).
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-scoreboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skip quietly rather than fail daily while the secrets are unset.
      - name: Check credentials are configured
        id: guard
        env:
          KEY: ${{ secrets.TTS_APP_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::TikTok credentials not configured - add the four TTS_* repository secrets. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh scoreboard data
        if: steps.guard.outputs.ready == 'true'
        env:
          TTS_APP_KEY: ${{ secrets.TTS_APP_KEY }}
          TTS_APP_SECRET: ${{ secrets.TTS_APP_SECRET }}
          TTS_SHOP_CIPHER: ${{ secrets.TTS_SHOP_CIPHER }}
          TTS_REFRESH_TOKEN: ${{ secrets.TTS_REFRESH_TOKEN }}
        run: python3 vip/refresh.py

      - name: Commit and push if the numbers moved
        if: steps.guard.outputs.ready == 'true'
        run: |
          if git diff --quiet -- vip/; then
            echo "::notice::No change since the last refresh; nothing to publish."
            exit 0
          fi
          coverage=$(python3 -c "import json;print(json.load(open('vip/data.json'))['coverage'])")
          total=$(python3 -c "import json;d=json.load(open('vip/data.json'));print(f\"\${sum(r['gmv'] for r in d['rows']):,.0f}\")")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vip/data.json vip/index.html
          git commit -m "Refresh VIP Live scoreboard ($coverage)" \
                     -m "Month-to-date total $total. Generated by vip/refresh.py."
          git push
          echo "::notice::Published $coverage - $total"
